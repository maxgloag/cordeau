framework:
    rate_limiter:
        # Login : 5 échecs par compte (email) sur 15 min, cf ADR 0027.
        # Clé = email seul pour l'instant. Un limiteur par IP est prévu (#170) : l'IP cliente
        # est exploitable en prod (SYMFONY_TRUSTED_PROXIES défini côté Fly), à vérifier d'abord.
        login:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
            cache_pool: cache.rate_limiter
